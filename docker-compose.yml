# llama.cpp server settings shared by gpt-cpu and gpt-gpu.
# Sampling (TEMPERATURE, TOP_P, ...) is sent per request by the orchestrator.
x-llama-env: &llama-env
  LLAMA_CACHE: /models
  LLAMA_ARG_HF_REPO: ${LLM_REPO}
  LLAMA_ARG_HF_FILE: ${LLM_NAME}
  LLAMA_ARG_CTX_SIZE: ${MAX_PROMPT_LENGTH}
  LLAMA_ARG_THREADS: ${NUM_THREADS}
  LLAMA_ARG_BATCH: ${BATCH_SIZE}
  LLAMA_ARG_N_PARALLEL: 1
  LLAMA_ARG_JINJA: 1
  LLAMA_ARG_THINK: deepseek

x-llama: &llama
  restart: unless-stopped
  volumes:
    - ./cache/models:/models
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    interval: 20s
    timeout: 10s
    retries: 10
    # The first start downloads the model, give it time.
    start_period: 30m

services:
  gpt-cpu:
    <<: *llama
    image: ghcr.io/ggml-org/llama.cpp:server-${LLAMA_CPP_BUILD:-b11347}
    profiles: ["cpu"]
    cpus: ${NUM_THREADS}
    environment:
      <<: *llama-env
      LLAMA_ARG_N_GPU_LAYERS: 0
  gpt-gpu:
    <<: *llama
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-${LLAMA_CPP_BUILD:-b11347}
    profiles: ["gpu"]
    environment:
      <<: *llama-env
      LLAMA_ARG_N_GPU_LAYERS: ${GPU_LAYERS}
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
  mailer:
    image: ${REGISTRY_USER}/${REGISTRY_REPO}-mailer:${IMAGE_TAG}
    build:
      context: ./src/mailer
    restart: unless-stopped
    depends_on:
      - orchestrator
    environment:
      - EMAIL_USER=${MAIL_USER}
      - EMAIL_PASS=${MAIL_PASS}
      - IMAP_SERVER=${MAIL_HOST}
      - ORCHESTRATOR_URL=http://orchestrator:5000/process_email

  db:
    image: ${REGISTRY_USER}/${REGISTRY_REPO}-db:${IMAGE_TAG}
    build:
      context: ./src/db
    restart: unless-stopped
    volumes:
      - ./cache/${PROJECT_NAME:-smb}/sqlite:/data

  orchestrator:
    image: ${REGISTRY_USER}/${REGISTRY_REPO}-orchestrator:${IMAGE_TAG}
    build:
      context: ./src/orchestrator
    restart: unless-stopped
    depends_on:
      # Only the service of the active profile exists, the other one is skipped.
      gpt-cpu:
        condition: service_healthy
        required: false
      gpt-gpu:
        condition: service_healthy
        required: false
      db:
        condition: service_started
    environment:
      - DB_PATH=/data/db.sqlite
      - GPT_SERVICE=${GPT_SERVICE}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://${GPT_SERVICE}:8080/v1}
      - MAX_TOKENS=${MAX_TOKENS}
      - TEMPERATURE=${TEMPERATURE}
      - TOP_P=${TOP_P}
      - TOP_K=${TOP_K}
      - REPETITION_PENALTY=${REPETITION_PENALTY}
      - BOT_EMAIL=${MAIL_USER}
      - BOT_PASS=${MAIL_PASS}
      - MASTER_EMAIL=${MASTER_EMAIL:-}
      - MASTER_TOKEN=${MASTER_TOKEN:-}
      - SMTP_SERVER=${MAIL_HOST}
      - WIKIPEDIA_TOP_K=${WIKIPEDIA_TOP_K}
      - WIKIPEDIA_MAX_CONTENT=${WIKIPEDIA_MAX_CONTENT}
      - WIKIPEDIA_CHUNK_SIZE=${WIKIPEDIA_CHUNK_SIZE}
      - WIKIPEDIA_LANG=${WIKIPEDIA_LANG}
      - WIKIPEDIA_THRESHOLD=${WIKIPEDIA_THRESHOLD}
      - WIKIPEDIA_MIN_SECTION=${WIKIPEDIA_MIN_SECTION}
      - EMBED_MODEL=${EMBED_MODEL:-}
      - EMBED_BATCH_SIZE=${EMBED_BATCH_SIZE:-}
      - RERANK_MODEL=${RERANK_MODEL:-}
      - RERANK_MAX_LENGTH=${RERANK_MAX_LENGTH:-}
      - FAQ_FILE=${FAQ_FILE:-}
      - FAQ_TOP_K=${FAQ_TOP_K:-}
      - FAQ_THRESHOLD=${FAQ_THRESHOLD:-}
      - MAX_PROMPT_LENGTH=${MAX_PROMPT_LENGTH}
      - PROMPT_MARGIN=${PROMPT_MARGIN:-}
      - TOKENIZE_URL=${TOKENIZE_URL:-}
      - MAIL_HISTORY_SIZE=${MAIL_HISTORY_SIZE}
      - PROMPT_FILE=${PROMPT_FILE}
      - TIMEOUT=${TIMEOUT}
      - FOOTER_FILE=${FOOTER_FILE}
      - LLM_NAME=${LLM_NAME}
    volumes:
      - ./cache/${PROJECT_NAME:-smb}/sqlite:/data
      - ./cache/vector_db:/app/vector_db
      - ./cache/wikipedia:/app/cache/wikipedia
      - ./cache/faq:/app/cache/faq
      - ./cache/huggingface:/root/.cache/huggingface
      - ./assets/:/app/assets
